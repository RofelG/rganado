server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /scratch { return 308 /scratch/$is_args$args; }
    location /scratch/ {
        proxy_pass http://scratch:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /flower { return 308 /flower/$is_args$args; }
    location /flower/ { try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ =404; }
}
